# HTTPS lab target on :443 for the boundary/443 modules. LAB ONLY — isolate it.
# Gives tls_carrier / ja3_mimicry / l7_enforce_443 / http_smuggling / waf_evasion
# something real to hit, and exposes deliberately-sensitive management/API paths
# so exposed_mgmt_api finds surface (each returns 200/401/403 = "the endpoint exists").
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    default_type text/plain;

    # root app — the plain target for TLS carrier / JA3 / smuggling / WAF probes
    location / { return 200 "MyGovNet BAS HTTPS lab\n"; }

    # --- deliberately-exposed management / API surface (exposed_mgmt_api) -------
    location = /actuator          { return 200 '{"_links":{"health":{}}}'; }
    location = /actuator/health   { return 200 '{"status":"UP"}'; }
    location = /actuator/env      { return 200 '{"activeProfiles":[]}'; }
    location /swagger-ui/         { return 200 "swagger-ui\n"; }
    location = /metrics           { return 200 "# HELP up 1\n"; }
    location = /admin             { return 401 "authentication required\n"; }
    location = /manager/html      { return 401 "Tomcat Manager\n"; }
    location = /console           { return 200 "H2 console\n"; }
    location = /.git/HEAD         { return 200 "ref: refs/heads/main\n"; }
    location = /.env              { return 200 "APP_ENV=lab\n"; }
    location = /server-status     { return 200 "Apache Server Status for lab\n"; }
    location /phpmyadmin/         { return 200 "phpMyAdmin\n"; }
}
